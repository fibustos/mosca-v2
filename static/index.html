<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mosca v2 | Closed-loop 3D</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
    <style>
      :root { color-scheme: dark; font-family: "IBM Plex Mono", monospace; background: #081014; color: #dce7ea; }
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px; border-bottom: 1px solid #23363b; }
      h1, h2 { font-family: "Space Grotesk", sans-serif; margin: 0; } h1 { font-size: 1.15rem; } h2 { font-size: .9rem; }
      #status { font-size: .72rem; color: #8cabae; } #app { display: grid; grid-template-columns: minmax(420px, 2fr) minmax(300px, 1fr); gap: 12px; padding: 12px; }
      section { min-width: 0; border: 1px solid #23363b; border-radius: 8px; background: #0c181c; overflow: hidden; }
      #viewport { height: calc(100vh - 93px); min-height: 520px; position: relative; } #viewport > canvas { display: block; width: 100%; height: 100%; }
      #hint { position: absolute; bottom: 12px; left: 12px; padding: 7px 9px; background: #081014cc; color: #9ccdd0; font-size: .7rem; pointer-events: none; }
      #brain-panel { position: absolute; top: 12px; right: 12px; width: min(38%, 290px); min-width: 190px; height: 230px; border: 1px solid #35634a; border-radius: 6px; background: #07120eeb; overflow: hidden; pointer-events: none; }
      #brain-panel h2 { position: absolute; z-index: 1; width: 100%; padding: 8px 10px; background: #07120eb8; color: #a8e8c1; font-size: .72rem; }
      #brain-viewport { width: 100%; height: 100%; background: #020805; } #brain-viewport canvas { display: block; width: 100%; height: 100%; }
      aside { display: grid; grid-template-rows: minmax(210px, 1fr) auto; gap: 12px; } .panel-header { padding: 12px 12px 0; }
      #raster { width: 100%; height: 250px; display: block; } .telemetry { padding: 12px; display: grid; gap: 10px; }
      .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .metric { background: #101f24; padding: 9px; border-radius: 4px; }
      .metric label { display: block; color: #789397; font-size: .65rem; margin-bottom: 4px; } .metric output { font-size: .9rem; color: #d9f0f0; }
      select, button { font: inherit; color: #dce7ea; background: #13262b; border: 1px solid #39555a; border-radius: 4px; padding: 7px; }
      .controls { display: flex; gap: 8px; align-items: center; } .controls label { font-size: .72rem; color: #9ab3b6; }
      #weights { font-size: .67rem; color: #9ab3b6; line-height: 1.5; overflow-wrap: anywhere; }
      @media (max-width: 900px) { #app { grid-template-columns: 1fr; } #viewport { height: 60vh; min-height: 400px; } }
    </style>
  </head>
  <body>
    <header><h1>MOSCA V2 / CLOSED-LOOP 3D</h1><span id="status">conectando…</span></header>
    <main id="app">
      <section id="viewport">
        <div id="hint">Clic sobre el plano para crear/mover comida (CS+)</div>
        <section id="brain-panel"><h2>Cerebro 3D (Fluorescencia GCaMP)</h2><div id="brain-viewport"></div></section>
      </section>
      <aside>
        <section><div class="panel-header"><h2>Raster neuronal en tiempo real</h2></div><canvas id="raster"></canvas></section>
        <section class="telemetry">
          <h2>Telemetría</h2>
          <div class="metrics">
            <div class="metric"><label>VELOCIDAD ANGULAR</label><output id="omega">—</output></div>
            <div class="metric"><label>DISTANCIA A COMIDA</label><output id="distance">—</output></div>
            <div class="metric"><label>CORRIENTE PN L/R</label><output id="pn">—</output></div>
            <div class="metric"><label>SPIKES DN L/R</label><output id="dn">—</output></div>
          </div>
          <div class="controls"><label for="profile">PERFIL</label><select id="profile"><option value="virgin">Virgen</option><option value="trained">Entrenada</option><option value="extinguished">Extinguida</option></select><button id="reset" type="button">Reiniciar</button></div>
          <div id="weights">Pesos KC→MBON: esperando telemetría.</div>
        </section>
      </aside>
    </main>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
